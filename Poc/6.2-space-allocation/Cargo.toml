[package]
name = "space_allocation"
version = "0.1.0"
edition = "2024"
default-run = "server"

[dependencies]
rand = "0.9.2"
leaky-bucket = "1.1.2"
randomx-rs = "1.4.1"
tokio = { version = "1.49.0", features = ["full"] }
const-hex = "1.18.1"
fs2 = "0.4.3"

[profile.release]
strip = "symbols"
panic = "abort"
lto = true
